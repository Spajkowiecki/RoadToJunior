<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przypomnienie programowania</title>
</head>

<body>
    <div id="app">
        <header>
            <div id="left-side">
                <img src="https://cdn-icons-png.flaticon.com/512/3081/3081972.png" alt="Logo" id="logo">
                <h1>Zdrowe & smacznie</h1>
            </div>
        </header>
        <main>
            <h2>Dodaj produkty do listy zakupowej:</h2>
            <form action="" id="shoppingList" class="form">
                <label>Wpisz nazwę produktu:</label>
                <input type="text" class="shoppingInput">
                <button class="shoppingSubmit" onClick="submit">dodaj</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
