<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <title>Przypomnienie programowania</title>
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="left-side">
                <div class="logo-container">
                    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/3081/3081972.png" alt="Logo"
                        id="logo">
                </div>
                <h1>SmaczneŻarcie</h1>
            </div>
        </header>
        <main>
            <section class="ingredients" aria-labelledby="ingredients-title">
                <h2 id="ingredients-title" class="ingredients__title">Składniki</h2>

                <form class="ingredients__form ingredients-form" id="ingredients-form">
                    <div class="ingredients-form__field">
                        <label for="ingredient-name" class="ingredients-form__label">Nazwa składnika:</label>
                        <input type="text" name="name" id="ingredient-name" class="ingredient-form__input" required>
                    </div>

                    <div class="ingredients-form__field">
                        <label for="ingredient-amount" class="ingredients-form__label">ilość:</label>
                        <input type="number" name="amount" id="ingredient-amount" class="ingredient-form__input" min="0"
                            step="any" required>
                    </div>

                    <div class="ingredients-form__field">
                        <label for="ingredient-unit" class="ingredients-form__label">Miara:</label>
                        <select id="ingredient-unit" name="unit" class="ingredients-form_select" required>
                            <option value="">Wybierz miarę</option>
                            <option value="ml">Ml</option>
                            <option value="g">Gram</option>
                            <option value="szt">sztuk</option>
                            <option value="tbsp">Łyżki</option>
                        </select>
                    </div>

                    <div class="ingredients-form__field">
                        <label for="ingredient-type" class="ingredients-form__label">typ produktu:</label>
                        <select id="ingredient-type" name="type" class="ingredients-form_select" required>
                            <option value="">rodzaj produktu</option>
                            <option value="fluid">Płynne</option>
                            <option value="dry">Suchy</option>
                            <option value="fats">Tłuszcz</option>
                        </select>
                    </div>

                    <button class="ingredients-form__submit" type="submit">Dodaj</button>
                </form>

                <div class="ingredients__summary ingredients-list" aria-labelledby="ingredients-list-title"
                    id="ingredients__summary">
                    <h3 class="ingredients-list__subtitle" id="ingredients-list-title">Lista składników:</h3>
                    <ol class="ingredients-list__items" id="ingredients-list">
                        <template id="ingredients-list-item">
                            <li class="ingredients__list-item">
                                <span class="ingredients__list-item-name" id="ingredients-list-item-name"></span>
                                <span class="ingredients__list-item-amount" id="ingredients-list-item-amount"></span>
                                <span class="ingredients__list-item-unit" id="ingredients-list-item-unit"></span>

                                <button onClick="removeIngredient">remove</button>
                            </li>
                        </template>
                    </ol>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
